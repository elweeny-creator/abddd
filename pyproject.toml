[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pt-insights-os"
version = "0.1.0"
description = "Analytics platform for Physical Therapy community data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "streamlit>=1.28",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=2.2",
    "faiss-cpu>=1.7",
    "spacy>=3.7",
]
privacy = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.1",
    "black>=23.0",
]
all = ["pt-insights-os[ml,privacy,dev]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
